<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هنت - غير متصل</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-v3.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Cairo, sans-serif;
        background: #1a1a2e;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        text-align: center;
        padding: 20px;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .logo {
        width: min(200px, 100%);
        aspect-ratio: 1;
        background: url("/assets/logo.png") center / contain no-repeat;
        pointer-events: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      h1 {
        font-size: 28px;
        font-weight: 900;
      }
      p {
        font-size: 16px;
        opacity: 0.7;
        max-width: 280px;
      }
      .btn {
        background: #ffe66d;
        color: #1a1a2e;
        border: 2px solid #000;
        border-radius: 24px;
        padding: 10px 28px;
        font-family: Cairo, sans-serif;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" role="img" aria-label="هنت"></div>
      <h1>أنت غير متصل</h1>
      <p>تحقق من اتصالك بالإنترنت وحاول مرة أخرى</p>
      <button class="btn" onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
