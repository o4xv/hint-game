name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
            client/package-lock.json
            server/package-lock.json
            e2e/package-lock.json
      - name: Install all package dependencies
        run: npm run install:all
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit and integration tests
        run: npm test
      - name: Compile production packages
        run: npm run build

  mobile-journeys:
    name: Playwright mobile journeys
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
            client/package-lock.json
            server/package-lock.json
            e2e/package-lock.json
      - name: Install all package dependencies
        run: npm run install:all
      - name: Compile production packages
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: e2e
      - name: Run the full Playwright suite
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
